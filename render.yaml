# Publicação no Render (https://render.com): New > Blueprint > escolha este repositório.
# Cria o serviço web (API + painel no mesmo endereço) usando um PostgreSQL que você já tem
# (o plano grátis do Render só permite um banco por conta).
services:
  - type: web
    name: lendcontrol
    runtime: node
    plan: free
    region: virginia
    buildCommand: >-
      cd web && npm ci && npm run build &&
      cd ../backend && npm ci && npx prisma generate && npm run build
    # Plano grátis não aceita preDeployCommand: migrações e usuários iniciais rodam ao iniciar (seed não duplica nada)
    startCommand: cd backend && npx prisma migrate deploy && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # cole o endereço do seu PostgreSQL e acrescente ?schema=lendcontrol no fim
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage/private
      - key: BACKUP_DIR
        value: ./storage/backups
      - key: SEED_PASSWORD
        sync: false # você digita a senha inicial dos usuários ao criar
